name: Core Infrastructure
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan and apply against
        type: environment
        default: development

env:
  ENVIRONMENT: ${{ inputs.environment || 'development' }}

permissions: # Investigate this blocks purpose with OIDC
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'development' }} # Scopes vars only, not a gate

    steps:
    - name: Checkout git repository
      uses: actions/checkout@v6

    - name: DEBUG OIDC claims # TEMPORARY - remove once auth works
      run: |
        TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
        python3 -c '
        import sys, json, base64
        p = sys.argv[1].split(".")[1]
        p += "=" * (-len(p) % 4)
        c = json.loads(base64.urlsafe_b64decode(p))
        print(json.dumps({k: c.get(k) for k in ["iss","aud","sub","repository","repository_owner","ref","environment","job_workflow_ref"]}, indent=2))
        ' "$TOKEN"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.TERRAFORM_CI_ROLE_ARN }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.15.0

    - name: Initialize Terraform
      run: terraform -chdir=core init

    - name: Terraform Validate
      run: terraform -chdir=core validate

    - name: Terraform Plan
      run: terraform -chdir=core plan -var-file=${{ env.ENVIRONMENT }}.tfvars -no-color -out=tfplan

    - name: Upload plan
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: core/tfplan
        retention-days: 5

  apply:
    runs-on: ubuntu-latest
    needs: plan
    environment: ${{ inputs.environment || 'development' }} # Scopes vars only, not a gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
    - name: Checkout git repository
      uses: actions/checkout@v6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.TERRAFORM_CI_ROLE_ARN }}
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.15.0

    - name: Download plan
      uses: actions/download-artifact@v4
      with:
        name: tfplan
        path: core

    - name: Initialize Terraform
      run: terraform -chdir=core init

    - name: Terraform Apply
      run: terraform -chdir=core apply -auto-approve tfplan
