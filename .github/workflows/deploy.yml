name: Core Infrastructure
on:
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan and apply against
        type: environment
        default: development

env:
  ENVIRONMENT: ${{ inputs.environment || 'development' }}

permissions: # Investigate this blocks purpose with OIDC
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::476140239102:role/infra-deploy # Is this dev role manually made? OR where? investigate
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.15.0

    - name: Initialize Terraform
      run: terraform -chdir=core init

    - name: Terraform Validate
      run: terraform -chdir=core validate

    - name: Terraform Plan
      run: terraform -chdir=core plan -var-file=${{ env.ENVIRONMENT }}.tfvars -no-color -out=tfplan

    - name: Upload plan
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: core/tfplan
        retention-days: 5

  apply:
    runs-on: ubuntu-latest
    needs: plan
    environment: development # Gate: protection rules live in repo settings

    steps:
    - name: Checkout git repository
      uses: actions/checkout@v6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::476140239102:role/infra-deploy
        aws-region: us-east-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.15.0

    - name: Download plan
      uses: actions/download-artifact@v4
      with:
        name: tfplan
        path: core

    - name: Initialize Terraform
      run: terraform -chdir=core init

    - name: Terraform Apply
      run: terraform -chdir=core apply -auto-approve tfplan
